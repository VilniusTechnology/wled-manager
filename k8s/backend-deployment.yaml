apiVersion: apps/v1
kind: Deployment
metadata:
  name: wled-manager-backend
  namespace: wled
  labels:
    app: wled-manager
    tier: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wled-manager
      tier: backend
  template:
    metadata:
      labels:
        app: wled-manager
        tier: backend
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: docker-registry-secret
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: backend
          image: your-registry/wled-manager-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add: ["NET_RAW"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: wled-manager-backend-config
            - secretRef:
                name: wled-manager-backend-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 10
            periodSeconds: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: local-data
              mountPath: /app/backups
              subPath: backups
            - name: local-data
              mountPath: /app/database
              subPath: database
      volumes:
        - name: local-data
          hostPath:
            path: /tmp/wled-manager
            type: DirectoryOrCreate
