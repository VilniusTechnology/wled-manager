apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wled-manager-cert
  namespace: wled
spec:
  secretName: wled-manager-tls
  dnsNames:
    - wled-manager.home
    - serveris.local
  usages:
    - server auth
    - digital signature
    - key encipherment
  issuerRef:
    name: homelab-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
