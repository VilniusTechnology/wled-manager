<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="180" height="40" viewBox="0 0 180 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo group -->
  <g>
    <!-- Orange circle background -->
    <circle cx="20" cy="20" r="19" fill="#F59E0B" />
    
    <!-- Black W letter - bold and centered -->
    <path d="M8 10 L13 30 L20 20 L27 30 L32 10" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Text part of the logo -->
    <g transform="translate(45, 0)">
      <!-- "WLED" text -->
      <text x="0" y="27" font-family="Arial, sans-serif" font-weight="bold" font-size="24">
        <tspan fill="#F59E0B">W</tspan><tspan fill="#333333">LED</tspan>
      </text>
      
      <!-- "Manager" text -->
      <text x="0" y="38" font-family="Arial, sans-serif" font-size="12" fill="#666666">Manager</text>
    </g>
  </g>
</svg>
